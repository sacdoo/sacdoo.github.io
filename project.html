<script>/* always load the latest project data (no stale browser cache) */document.write('<script src="data/projects.js?v='+Date.now()+'"><\/script>')</script>
<script>
(() => {
const IMG='https://framerusercontent.com/images/', ASSET='https://framerusercontent.com/assets/', LOCAL='assets/media/';
const CO=location.protocol==='file:'?'':'crossorigin="anonymous"'; // file:// pages can't use CORS on local files
// local file first; if missing, fall back to the original host (without CORS, so it still loads)
const fb=`onerror="if(this.dataset.remote){this.removeAttribute('crossorigin');this.src=this.dataset.remote;this.dataset.remote=''}"`;
const base=u=>u.split('?')[0].split('/').pop();
const CCV=id=>`https://www-ccv.adobe.io/v1/player/ccv/${id}/embed?api_key=behance1&bgcolor=%23ffffff`;
const ME='엄태은';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=new URLSearchParams(location.search).get('p');
const i=Math.max(0,PROJECTS.findIndex(p=>p.slug===slug)); const p=PROJECTS[i]; const next=PROJECTS[(i+1)%PROJECTS.length];
document.title=`${p.title.replace(/\n/g,' ')} - SAC`;
document.body.dataset.bg=p.bg||'white';
if(p.seamless) document.body.dataset.seamless=''; // Behance board images read as one continuous canvas

function media(m, cls){
  const [t,src,w,ar]=m;
  let el;
  if(t==='i') el=`<img data-mirror="media" ${CO} loading="lazy" alt="" src="${LOCAL+src.split('?')[0]}" data-remote="${IMG+src}" ${fb}>`;
  else if(t==='m') el=`<video data-mirror="media" ${CO} src="${LOCAL+src}" data-remote="${ASSET+src}" ${fb} autoplay muted loop playsinline preload="metadata"></video>`;
  else if(t==='x') el=`<iframe data-mirror="media" src="${src}" title="${esc(p.title)} interactive" allow="fullscreen"></iframe>`;
  else if(t==='L') el=`<img data-mirror="media" ${CO} loading="lazy" alt="" src="${LOCAL+src}">`;
  else if(t==='l') el=`<video data-mirror="media" ${CO} src="${LOCAL+src}" autoplay muted loop playsinline preload="metadata"></video>`;
  else if(t==='b') el=`<img data-mirror="media" ${CO} loading="lazy" alt="" src="${LOCAL+base(src)}" data-remote="${src}" ${fb}>`;
  else if(t==='c') el=`<video data-mirror="media" ${CO} src="${LOCAL}ccv_${src}.mp4" data-ccv="${src}" onerror="this.outerHTML='<iframe data-mirror=&quot;media&quot; src=&quot;'+'${CCV(src)}'+'&quot; allow=&quot;autoplay; fullscreen&quot; title=&quot;video&quot;></iframe>'" autoplay muted loop playsinline preload="metadata"></video>`;
  else el=`<iframe data-mirror="media" src="https://player.vimeo.com/video/${src}?muted=1&autoplay=1&autopause=0&controls=0&loop=1&dnt=1" allow="autoplay; fullscreen; picture-in-picture" loading="lazy" title="${esc(p.title)} video"></iframe>`;
  return el;
}
let html='';
if(p.hero){ html+=`<div class="pj-hero${p.hero[4]==='contain'?' contain':''}${p.hero[0]==='x'?' is-x':''}" data-mirror="box" style="aspect-ratio:${p.hero[3]}">${media(p.hero)}${p.heroSound?'<button type="button" class="pj-sound" aria-pressed="false">Sound on</button>':''}</div>`; }
html+=`<div class="wrap">
  <header class="pj-head"><h1><span data-mirror="text">${esc(p.title.split('\n')[0])}</span>${p.title.includes('\n')?'\n'+esc(p.title.split('\n').slice(1).join(' ')):''}</h1>
    ${(p.awards&&p.awards.length)?`<div class="pj-awards" aria-label="Awards">${p.awards.map(w=>w.img?`<img src="${w.img}" alt="${esc(w.name)}" title="${esc(w.name)}">`:`<span class="pj-award-txt" title="${esc(w.name+(w.grade?' — '+w.grade:''))}"><b>${esc(w.name)}</b>${w.grade?`<small>${esc(w.grade)}</small>`:''}</span>`).join('')}</div>`:''}
  </header>`;
// body: first text = headline, second text = intro; after that short text = subheading, long = paragraph
const IS_BH=p.source==='behance', IS_SAM=!p.source, BH=IS_BH&&!p.layoutIntro;
let texts=BH?2:0, sub=null, row=[];
const flush=()=>{ if(row.length){ html+=`<div class="pj-media">${row.join('')}</div>`; row=[]; } };
const closeSub=()=>{ if(sub){ html+=`<section class="pj-sub"><h3>${esc(sub.h||'')}</h3><div class="pj-text">${esc(sub.p||'')}</div></section>`; sub=null; } };
let introOpen=!BH; if(introOpen) html+='<section class="pj-intro">';
for(const b of p.body){
  if(typeof b==='string'){
    texts++;
    if(texts===1){ html+=`<h2>${esc(b)}</h2>`; continue; }
    if(texts===2){ html+=`<div class="pj-text">${esc(b)}</div></section>`; introOpen=false; continue; }
    flush();
    if(BH){ closeSub(); sub=b.length<80?{h:b}:{p:b}; closeSub(); continue; }
    if(b.length<80){ closeSub(); sub={h:b}; } else { if(!sub) sub={}; sub.p=(sub.p?sub.p+'\n\n':'')+b; }
    continue;
  }
  if(introOpen && b[2]<20){ html+=`<div style="width:clamp(96px,13vw,180px)">${media(b).replace('<img','<img style="width:100%;display:block"')}</div>`; continue; }
  if(introOpen){ html+='</section>'; introOpen=false; }
  closeSub();
  const cls=b[2]<20?'small':b[2]<22?'fifth':b[2]<30?'quarter':b[2]<40?'third':b[2]<60?'half':'';
  row.push(`<figure class="${cls}"><div class="box" style="aspect-ratio:${b[3]}">${media(b)}</div></figure>`);
}
if(introOpen) html+='</section>';
closeSub(); flush();
const owner=p.owner||(p.credits.find(([r])=>/project owner/i.test(r))||[,p.client])[1];
const contrib=p.contrib||[...new Set(p.credits.filter(([r,n])=>n.split(/,\s*/).includes(ME)).map(([r])=>r.replace(/\b\w/g,c=>c.toUpperCase()).replace(/^Motion Graphic$/,'Motion Graphics')))].join(', ');
html+=`<dl class="pj-credits">
    <div><dt>Project Owner</dt><dd>${esc(owner)}</dd></div>
    ${IS_SAM?'<div><dt>Agency</dt><dd>SAM SEOUL</dd></div>':''}
    <div><dt>Contributions</dt><dd>${contrib.split(/,\s*/).map(c=>`<span class="nowrap">${esc(c)}</span>`).join('<br>')}</dd></div>
  </dl>
  <div class="pj-foot">
    ${IS_BH?`<a class="src" href="${p.url}" target="_blank" rel="noopener">View on Behance ↗</a>`:IS_SAM?`<a class="src" href="${SOURCE_BASE+p.slug}" target="_blank" rel="noopener">Project by SAM SEOUL · Original case study ↗</a>`:'<span></span>'}
    <a class="next" href="project.html?p=${encodeURIComponent(next.slug)}">Next — ${esc(next.title.replace(/\n/g,' '))} →</a>
  </div>
</div>`;
document.getElementById('project').innerHTML=html;
// scroll handed up from the interactive sketch (touch swipe inside the iframe)
let flingRaf=0;
addEventListener('message',e=>{ const d=e.data; if(!d||!d.furryScroll) return; cancelAnimationFrame(flingRaf);
  if(d.furryScroll==='by') scrollBy(0,d.dy);
  else if(d.furryScroll==='fling'){ let v=d.v; const step=()=>{ if(Math.abs(v)<.5) return; scrollBy(0,v); v*=.94; flingRaf=requestAnimationFrame(step); }; step(); } });
const snd=document.querySelector('.pj-sound');
if(snd){ const hv=snd.parentNode.querySelector('video'); snd.onclick=()=>{ hv.muted=!hv.muted; if(!hv.muted){ hv.currentTime=0; hv.play().catch(()=>{}); } snd.setAttribute('aria-pressed',String(!hv.muted)); snd.textContent=hv.muted?'Sound on':'Sound off'; }; }
})();
</script>
